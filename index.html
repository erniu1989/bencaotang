<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, user-scalable=no"
>
<meta
  name="description"
  content="本草堂——以趣味互动传播本草知识，感受中医药文化魅力"
>
<title>本草堂｜本草知识数字游戏</title>

<style>
*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --paper:#F6F1E8;
  --paper-dark:#EDE4D5;
  --paper-deep:#DED2BF;
  --ink:#2F312D;
  --ink-light:#676A64;
  --ink-faint:#AAA394;
  --vermilion:#B94A35;
  --vermilion-dark:#913825;
  --green:#527A52;
  --green-light:#E3EDE1;
  --blue:#587997;
  --gold:#A67C18;
  --orange:#C57D43;
  --error:#A34C3C;
  --white:#FFFDF8;
  --radius:10px;
  --shadow:0 5px 18px rgba(47,49,45,.08);
  --font-title:"STKaiti","KaiTi","楷体",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "Microsoft YaHei","PingFang SC",sans-serif;
  --font-num:Georgia,serif;
}

html{
  font-size:16px;
  -webkit-text-size-adjust:100%;
}

body{
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.7;
  background:
    radial-gradient(circle at 10% 10%,rgba(82,122,82,.07),transparent 30%),
    radial-gradient(circle at 90% 15%,rgba(185,74,53,.05),transparent 32%),
    var(--paper);
}

button{
  min-height:42px;
  padding:8px 20px;
  border:1.5px solid var(--ink);
  border-radius:var(--radius);
  color:var(--ink);
  background:var(--white);
  cursor:pointer;
  font-family:var(--font-title);
  font-size:1rem;
  letter-spacing:.04em;
  transition:.2s ease;
}

button:hover{
  color:#fff;
  background:var(--ink);
  box-shadow:0 0 0 4px rgba(47,49,45,.08);
}

button:active{
  transform:scale(.98);
}

button:disabled{
  cursor:not-allowed;
  opacity:.55;
}

button.primary{
  color:#fff;
  border-color:var(--vermilion);
  background:var(--vermilion);
}

button.primary:hover{
  border-color:var(--vermilion-dark);
  background:var(--vermilion-dark);
}

button.secondary{
  color:var(--green);
  border-color:var(--green);
}

button.secondary:hover{
  color:#fff;
  background:var(--green);
}

button.danger{
  color:var(--error);
  border-color:var(--error);
}

button.danger:hover{
  color:#fff;
  background:var(--error);
}

button.small{
  min-height:34px;
  padding:4px 12px;
  font-size:.85rem;
}

h1,h2,h3,h4{
  font-family:var(--font-title);
  font-weight:400;
  letter-spacing:.08em;
}

#app{
  width:100%;
  max-width:860px;
  min-height:100vh;
  min-height:100dvh;
  margin:0 auto;
  padding:16px;
}

.screen{
  display:none;
  animation:fadeIn .3s ease;
}

.screen.active{
  display:block;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-4px)}
}

@keyframes popIn{
  from{opacity:0;transform:scale(.94)}
  to{opacity:1;transform:scale(1)}
}

@keyframes comboFloat{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-45px) scale(1.25)}
}

.shake{
  animation:shake .35s ease;
}

.pop-in{
  animation:popIn .3s ease;
}

.header{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:12px;
  align-items:center;
  padding:12px 0;
  margin-bottom:16px;
  border-bottom:1px solid var(--ink-faint);
}

.header h1{
  text-align:center;
  font-size:1.45rem;
}

.header-placeholder{
  min-width:70px;
}

.score-display{
  color:var(--gold);
  font-family:var(--font-num);
  white-space:nowrap;
}

.home-title{
  padding:36px 10px 16px;
  text-align:center;
}

.home-title h1{
  color:var(--ink);
  font-size:3rem;
  letter-spacing:.22em;
}

.home-title .subtitle-line{
  width:150px;
  height:2px;
  margin:12px auto;
  background:linear-gradient(
    90deg,
    transparent,
    var(--vermilion),
    transparent
  );
}

.home-title p{
  color:var(--ink-light);
  font-family:var(--font-title);
  letter-spacing:.08em;
}

.home-intro{
  max-width:620px;
  margin:8px auto 24px;
  padding:14px 18px;
  border:1px solid var(--paper-deep);
  border-radius:var(--radius);
  color:var(--ink-light);
  background:rgba(255,253,248,.65);
  text-align:center;
  font-size:.9rem;
}

.home-profile{
  display:flex;
  justify-content:center;
  gap:24px;
  margin-bottom:22px;
  padding:12px 16px;
  border-radius:var(--radius);
  background:var(--paper-dark);
}

.profile-item{
  text-align:center;
}

.profile-label{
  color:var(--ink-light);
  font-size:.78rem;
}

.profile-value{
  color:var(--gold);
  font-family:var(--font-title);
  font-size:1.08rem;
}

.mode-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  margin:20px 0;
}

.mode-card{
  min-height:150px;
  padding:22px 16px;
  border:1.5px solid var(--paper-deep);
  border-radius:var(--radius);
  background:rgba(255,253,248,.8);
  box-shadow:var(--shadow);
  cursor:pointer;
  text-align:center;
  transition:.25s ease;
}

.mode-card:hover{
  border-color:var(--green);
  transform:translateY(-3px);
  box-shadow:0 8px 25px rgba(47,49,45,.12);
}

.mode-icon{
  display:block;
  margin-bottom:8px;
  font-size:2.2rem;
}

.mode-name{
  margin-bottom:4px;
  font-family:var(--font-title);
  font-size:1.18rem;
}

.mode-desc{
  color:var(--ink-light);
  font-size:.8rem;
}

.home-nav{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin:24px 0;
}

.notice{
  margin:24px 0 8px;
  padding:12px 14px;
  border-top:1px solid var(--paper-deep);
  color:var(--ink-light);
  text-align:center;
  font-size:.76rem;
  line-height:1.6;
}

.game-header{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
  padding:10px 12px;
  border-radius:var(--radius);
  background:var(--paper-dark);
}

.game-header .progress{
  color:var(--ink-light);
  font-family:var(--font-num);
}

.game-header .timer{
  min-width:80px;
  color:var(--vermilion);
  font-family:var(--font-num);
  font-size:1.12rem;
  font-weight:bold;
  text-align:center;
}

.game-header .timer.warning{
  color:var(--error);
}

.game-header .combo{
  color:var(--gold);
  font-weight:bold;
  text-align:right;
}

.timer-bar{
  height:6px;
  margin-bottom:16px;
  overflow:hidden;
  border-radius:4px;
  background:var(--paper-deep);
}

.timer-bar-inner{
  width:100%;
  height:100%;
  background:var(--green);
  transition:width 1s linear,background .2s;
}

.timer-bar-inner.warning{
  background:var(--vermilion);
}

.question-area{
  margin:18px 0;
}

.question-text{
  margin-bottom:16px;
  padding:17px;
  border-left:4px solid var(--vermilion);
  border-radius:var(--radius);
  background:var(--paper-dark);
  font-size:1.03rem;
  line-height:1.9;
}

.question-subtitle{
  margin:10px 0;
  color:var(--ink-light);
  font-size:.88rem;
}

.question-tools{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin:10px 0 14px;
}

.selection-count{
  color:var(--ink-light);
  font-size:.86rem;
}

.options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.option-btn{
  min-height:54px;
  padding:11px 14px;
  border-color:var(--paper-deep);
  font-family:var(--font-body);
  font-size:.94rem;
  line-height:1.5;
  text-align:left;
}

.option-btn:hover{
  color:var(--ink);
  border-color:var(--ink);
  background:var(--paper-dark);
}

.option-btn.correct{
  color:var(--green);
  border-color:var(--green);
  background:var(--green-light);
}

.option-btn.wrong{
  color:var(--error);
  border-color:var(--error);
  background:#F4E3DF;
}

.option-btn.disabled{
  pointer-events:none;
}

.knowledge-card{
  margin:14px 0;
  padding:17px;
  border:1px solid var(--paper-deep);
  border-radius:var(--radius);
  background:var(--white);
  box-shadow:var(--shadow);
}

.knowledge-card h4{
  margin-bottom:8px;
  color:var(--vermilion);
  font-size:1.08rem;
}

.knowledge-card p{
  margin:5px 0;
  color:var(--ink-light);
  font-size:.87rem;
}

.knowledge-card strong{
  color:var(--ink);
}

.fun-fact{
  margin-top:10px!important;
  padding-top:9px;
  border-top:1px dashed var(--paper-deep);
  color:var(--orange)!important;
}

.answer-right{
  color:var(--green)!important;
}

.answer-wrong{
  color:var(--error)!important;
}

.next-area{
  margin:16px 0;
  text-align:center;
}

.next-area button{
  min-width:160px;
}

.hint-box{
  margin:10px 0;
  padding:10px 14px;
  border-left:3px solid var(--gold);
  border-radius:6px;
  color:#765B17;
  background:#F6EDCF;
  font-size:.86rem;
}

.herb-pool{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:14px 0;
