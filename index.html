<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><script src="./index_files/index.js.下载"></script><script src="./index_files/index(1).js.下载"></script><script src="./index_files/index.min.js.下载"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="本草堂 - 中药益智休闲小游戏">
<title>本草堂</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#F5F0E8;--ink:#2C2C2C;--ink-light:#6B6B6B;--ink-faint:#B0A89A;
  --vermilion:#C84B31;--herb-green:#5B8C5A;--cold-blue:#5B7FA5;
  --warm-orange:#D4915E;--gold:#B8860B;--error:#A0522D;
  --paper-dark:#E8E0D0;--paper-darker:#D8CFC0;
  --radius:6px;--shadow:0 2px 12px rgba(44,44,44,0.08);
  --font-title:'STKaiti','KaiTi','楷体',serif;
  --font-body:'STSong','SimSun','宋体',serif;
  --font-num:'Georgia',serif;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);color:var(--ink);
  background:var(--paper);min-height:100vh;min-height:100dvh;
  overflow-x:hidden;line-height:1.8;
  background-image:
    radial-gradient(ellipse at 20% 80%,rgba(91,140,90,0.04) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 20%,rgba(91,127,165,0.04) 0%,transparent 50%);
}
a{color:var(--vermilion);text-decoration:none}
h1,h2,h3,h4{font-family:var(--font-title);font-weight:400;letter-spacing:0.08em}
button{
  font-family:var(--font-title);cursor:pointer;border:2px solid var(--ink);
  background:var(--paper);color:var(--ink);padding:8px 24px;border-radius:var(--radius);
  font-size:1rem;transition:all .3s ease-out;letter-spacing:0.05em;
}
button:hover{background:var(--ink);color:var(--paper);box-shadow:0 0 0 4px rgba(44,44,44,0.1)}
button:active{transform:scale(0.97)}
button.primary{background:var(--vermilion);color:#fff;border-color:var(--vermilion)}
button.primary:hover{background:#a33d27;border-color:#a33d27}
button.small{padding:4px 14px;font-size:0.85rem}
.card{background:var(--paper);border:1.5px solid var(--ink-faint);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:all .3s ease-out}
.card:hover{box-shadow:0 4px 20px rgba(44,44,44,0.12)}
.divider{height:1px;border:none;margin:16px 0;background:linear-gradient(90deg,transparent,var(--ink-faint),transparent)}
.badge{display:inline-block;padding:2px 10px;border-radius:3px;font-size:0.75rem;font-family:var(--font-title)}
.badge-cold{background:rgba(91,127,165,0.15);color:var(--cold-blue)}
.badge-warm{background:rgba(212,145,94,0.15);color:var(--warm-orange)}
.badge-hot{background:rgba(200,75,49,0.15);color:var(--vermilion)}
.badge-neutral{background:rgba(107,107,107,0.15);color:var(--ink-light)}
.badge-green{background:rgba(91,140,90,0.15);color:var(--herb-green)}
.badge-gold{background:rgba(184,134,11,0.15);color:var(--gold)}
#app{max-width:800px;margin:0 auto;padding:16px;min-height:100vh;min-height:100dvh}
.screen{display:none;animation:fadeIn .4s ease-out}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes popIn{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
@keyframes bounceNum{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes inkSpread{from{box-shadow:0 0 0 0 rgba(44,44,44,0.2)}to{box-shadow:0 0 0 12px rgba(44,44,44,0)}}
@keyframes scrollUnfurl{from{max-height:0;opacity:0}to{max-height:600px;opacity:1}}
@keyframes comboFloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(1.3)}}
.shake{animation:shake .4s ease-out}
.pop-in{animation:popIn .3s ease-out}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ink-faint);margin-bottom:16px}
.header h1{font-size:1.5rem}
.header .back-btn{font-size:0.9rem;padding:4px 12px}
.header .score-display{font-family:var(--font-num);color:var(--gold);font-size:1.1rem;display:flex;align-items:center;gap:4px}
.home-title{text-align:center;padding:40px 0 20px}
.home-title h1{font-size:2.8rem;letter-spacing:0.15em;color:var(--ink);text-shadow:2px 2px 0 rgba(44,44,44,0.05)}
.home-title p{font-size:1rem;color:var(--ink-light);margin-top:8px;letter-spacing:0.1em}
.home-title .subtitle-line{width:120px;height:2px;margin:12px auto;background:linear-gradient(90deg,transparent,var(--vermilion),transparent)}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin:24px 0}
.mode-card{cursor:pointer;text-align:center;padding:24px 16px;border:1.5px solid var(--ink-faint);border-radius:var(--radius);background:var(--paper);transition:all .3s ease-out}
.mode-card:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 6px 24px rgba(44,44,44,0.1)}
.mode-card .mode-icon{font-size:2.2rem;margin-bottom:8px;display:block}
.mode-card .mode-name{font-family:var(--font-title);font-size:1.2rem;letter-spacing:0.08em;margin-bottom:4px}
.mode-card .mode-desc{font-size:0.8rem;color:var(--ink-light)}
.home-nav{display:flex;gap:12px;justify-content:center;margin:20px 0 40px;flex-wrap:wrap}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.game-header .timer{font-family:var(--font-num);color:var(--vermilion);font-size:1.1rem}
.game-header .progress{font-family:var(--font-num);color:var(--ink-light)}
.game-header .combo{font-family:var(--font-num);color:var(--gold);font-weight:bold;font-size:1.2rem}
.combo.pop{animation:bounceNum .3s ease-out}
.question-area{margin:20px 0}
.question-text{font-size:1.1rem;line-height:2;margin-bottom:16px;padding:16px;background:var(--paper-dark);border-radius:var(--radius);border-left:3px solid var(--vermilion)}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option-btn{text-align:left;padding:12px 16px;font-size:0.95rem;border:1.5px solid var(--ink-faint);background:var(--paper);border-radius:var(--radius);transition:all .2s ease-out;font-family:var(--font-body);line-height:1.5}
.option-btn:hover{border-color:var(--ink);background:var(--paper-dark)}
.option-btn.correct{border-color:var(--herb-green);background:rgba(91,140,90,0.1);color:var(--herb-green)}
.option-btn.wrong{border-color:var(--error);background:rgba(160,82,45,0.1);color:var(--error)}
.option-btn.disabled{pointer-events:none;opacity:0.6}
.result-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(44,44,44,0.5);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .3s ease-out}
.result-card{background:var(--paper);border:2px solid var(--ink-faint);border-radius:var(--radius);padding:32px;max-width:400px;width:90%;text-align:center;animation:popIn .3s ease-out}
.result-card h2{font-size:1.6rem;margin-bottom:12px}
.result-card .score-big{font-family:var(--font-num);font-size:2.4rem;color:var(--gold);margin:12px 0}
.result-card .btn-group{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.knowledge-card{background:var(--paper-dark);border:1px solid var(--ink-faint);border-radius:var(--radius);padding:16px;margin:12px 0;animation:scrollUnfurl .5s ease-out;text-align:left}
.knowledge-card h4{font-size:1.1rem;margin-bottom:6px;color:var(--vermilion)}
.knowledge-card p{font-size:0.85rem;color:var(--ink-light);line-height:1.7}
.knowledge-card .fun-fact{margin-top:8px;padding-top:8px;border-top:1px dashed var(--ink-faint);font-size:0.8rem;color:var(--warm-orange)}
.herb-pool{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.herb-chip{padding:6px 14px;border:1.5px solid var(--ink-faint);border-radius:var(--radius);font-size:0.9rem;cursor:pointer;transition:all .2s ease-out;background:var(--paper)}
.herb-chip:hover{border-color:var(--ink)}
.herb-chip.selected{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.herb-chip.wrong-pick{border-color:var(--error);color:var(--error);animation:shake .3s}
.formula-slots{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--paper-dark);border-radius:var(--radius);min-height:48px;margin:12px 0;border:1px dashed var(--ink-faint)}
.formula-slots .herb-chip{background:var(--herb-green);color:#fff;border-color:var(--herb-green)}
.classify-lanes{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:16px 0}
.classify-lane{padding:12px 8px;text-align:center;border:2px dashed var(--ink-faint);border-radius:var(--radius);min-height:80px;transition:all .2s;font-family:var(--font-title);font-size:0.95rem}
.classify-lane.highlight{border-color:var(--ink);background:var(--paper-dark)}
.classify-lane .lane-items{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.classify-lane .lane-item{font-size:0.8rem;padding:2px 6px;background:var(--paper);border-radius:3px;animation:popIn .2s ease-out}
.current-herb-display{text-align:center;padding:24px;font-size:1.8rem;font-family:var(--font-title);letter-spacing:0.1em;background:var(--paper-dark);border-radius:var(--radius);margin:16px 0;border:1px solid var(--ink-faint)}
.combo-float{position:fixed;pointer-events:none;z-index:200;font-family:var(--font-num);font-size:1.5rem;color:var(--gold);font-weight:bold;animation:comboFloat .8s ease-out forwards}
.match-grid{display:grid;gap:6px;margin:16px 0;grid-template-columns:repeat(4,1fr)}
.match-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink-faint);border-radius:var(--radius);font-size:0.8rem;text-align:center;padding:4px;cursor:pointer;transition:all .2s ease-out;background:var(--paper);line-height:1.3;word-break:break-all}
.match-cell:hover{border-color:var(--ink)}
.match-cell.selected{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.match-cell.matched{background:rgba(91,140,90,0.15);border-color:var(--herb-green);color:var(--herb-green);pointer-events:none}
.match-cell.wrong{animation:shake .3s;border-color:var(--error)}
.match-cell.hidden{visibility:hidden;pointer-events:none}
.ency-progress{text-align:center;padding:16px;margin-bottom:16px}
.ency-progress .count{font-family:var(--font-num);font-size:1.8rem;color:var(--gold)}
.ency-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ency-card{padding:16px;text-align:center;border:1.5px solid var(--ink-faint);border-radius:var(--radius);cursor:pointer;transition:all .3s;background:var(--paper)}
.ency-card:hover{border-color:var(--ink);transform:translateY(-2px)}
.ency-card.locked{opacity:0.4;filter:grayscale(1)}
.ency-card .herb-emoji{font-size:2rem;margin-bottom:4px;display:block}
.ency-card .herb-name{font-family:var(--font-title);font-size:1.05rem;letter-spacing:0.05em}
.ency-card .herb-cat{font-size:0.75rem;color:var(--ink-light)}
.ency-detail{margin:16px 0}
.ency-detail h2{font-size:1.6rem;margin-bottom:4px}
.ency-detail .detail-section{margin:12px 0}
.ency-detail .detail-section h4{font-size:0.95rem;color:var(--vermilion);margin-bottom:4px}
.ency-detail .detail-section p{font-size:0.9rem;color:var(--ink-light)}
.category-filter{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.category-filter button{font-size:0.8rem;padding:4px 10px}
.category-filter button.active{background:var(--ink);color:var(--paper)}
.lb-list{margin:16px 0}
.lb-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ink-faint)}
.lb-item .rank{font-family:var(--font-num);font-size:1.2rem;width:36px;color:var(--ink-light)}
.lb-item .rank.top1{color:var(--gold)}
.lb-item .rank.top2{color:var(--ink-light)}
.lb-item .rank.top3{color:var(--warm-orange)}
.lb-item .name{flex:1;margin:0 12px}
.lb-item .lb-score{font-family:var(--font-num);color:var(--gold);font-size:1.1rem}
.symptom-card{background:var(--paper-dark);border-radius:var(--radius);padding:20px;margin:16px 0;border-left:3px solid var(--cold-blue)}
.symptom-card .patient{font-family:var(--font-title);font-size:1rem;color:var(--cold-blue);margin-bottom:8px}
.symptom-card .symptoms{font-size:0.95rem;line-height:2}
@media(max-width:600px){
  #app{padding:10px}
  .home-title h1{font-size:2rem}
  .mode-grid{grid-template-columns:1fr 1fr;gap:10px}
  .mode-card{padding:16px 10px}
  .mode-card .mode-icon{font-size:1.8rem}
  .mode-card .mode-name{font-size:1rem}
  .options-grid{grid-template-columns:1fr}
  .match-grid{grid-template-columns:repeat(4,1fr);gap:4px}
  .match-cell{font-size:0.7rem}
  .classify-lanes{grid-template-columns:repeat(3,1fr)}
  .ency-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
@media(max-width:380px){
  .mode-grid{grid-template-columns:1fr}
  .match-grid{grid-template-columns:repeat(3,1fr)}
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--paper-dark)}
::-webkit-scrollbar-thumb{background:var(--ink-faint);border-radius:3px}
</style>

<body>
<div id="app">
  <div id="screen-home" class="screen active">
    <div class="home-title">
      <h1>本 草 堂</h1>
      <div class="subtitle-line"></div>
      <p>辨药识性 · 组方济世 · 博学成才</p>
    </div>
    <div class="mode-grid">
      <div class="mode-card" onclick="App.startGame(&#39;identify&#39;)">
        <span class="mode-icon">🌿</span>
        <div class="mode-name">辨药识材</div>
        <div class="mode-desc">根据线索猜出药材</div>
      </div>
      <div class="mode-card" onclick="App.startGame(&#39;formula&#39;)">
        <span class="mode-icon">📜</span>
        <div class="mode-name">组方配伍</div>
        <div class="mode-desc">选出方剂全部组成</div>
      </div>
      <div class="mode-card" onclick="App.startGame(&#39;classify&#39;)">
        <span class="mode-icon">⚖</span>
        <div class="mode-name">四性五味</div>
        <div class="mode-desc">快速分类药材性味</div>
      </div>
      <div class="mode-card" onclick="App.startGame(&#39;prescribe&#39;)">
        <span class="mode-icon">🩺</span>
        <div class="mode-name">对症开方</div>
        <div class="mode-desc">辨证论治选方剂</div>
      </div>
      <div class="mode-card" onclick="App.startGame(&#39;match&#39;)">
        <span class="mode-icon">🔗</span>
        <div class="mode-name">药材连连看</div>
        <div class="mode-desc">配对药材与功效</div>
      </div>
      <div class="mode-card" onclick="App.showScreen(&#39;encyclopedia&#39;)">
        <span class="mode-icon">📖</span>
        <div class="mode-name">百草图鉴</div>
        <div class="mode-desc">收集与查阅药材</div>
      </div>
    </div>
    <div class="home-nav">
      <button onclick="App.showScreen(&#39;leaderboard&#39;)">🏆 排行榜</button>
      <button onclick="App.resetProgress()">🔄 重置进度</button>
    </div>
    <div style="text-align:center;padding:8px;color:var(--ink-faint);font-size:0.8rem">
      医道积分：<span id="home-score" style="color:var(--gold);font-family:var(--font-num)">0</span>
    </div>
  </div>
  <div id="screen-game" class="screen">
    <div class="header">
      <button class="back-btn" onclick="App.showScreen(&#39;home&#39;)">← 返回</button>
      <h1 id="game-title">游戏</h1>
      <div class="score-display">⭐ <span id="game-score">0</span></div>
    </div>
    <div class="game-header">
      <span class="progress" id="game-progress"></span>
      <span class="timer" id="game-timer"></span>
      <span class="combo" id="game-combo"></span>
    </div>
    <div id="game-content"></div>
  </div>
  <div id="screen-encyclopedia" class="screen">
    <div class="header">
      <button class="back-btn" onclick="App.showScreen(&#39;home&#39;)">← 返回</button>
      <h1>百草图鉴</h1>
      <div class="score-display">⭐ <span id="ency-score">0</span></div>
    </div>
    <div class="ency-progress">
      <span class="count" id="ency-count">0/0</span>
      <p style="color:var(--ink-light);font-size:0.85rem">已收集药材</p>
    </div>
    <div class="category-filter" id="ency-filter"></div>
    <div id="ency-content"></div>
  </div>
  <div id="screen-leaderboard" class="screen">
    <div class="header">
      <button class="back-btn" onclick="App.showScreen(&#39;home&#39;)">← 返回</button>
      <h1>排行榜</h1>
      <div></div>
    </div>
    <div id="lb-content"></div>
  </div>
</div>
