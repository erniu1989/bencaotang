<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>
<meta
  name="description"
  content="本草堂游戏数据统计后台"
>
<title>本草堂 - 游戏数据统计</title>

<style>
*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --primary:#B94A35;
  --primary-dark:#913825;
  --green:#527A52;
  --blue:#587997;
  --orange:#C57D43;
  --gold:#A67C18;
  --paper:#F6F1E8;
  --white:#FFFFFF;
  --text:#333333;
  --muted:#777777;
  --border:#E5E0D8;
  --danger:#B63E32;
}

body{
  min-height:100vh;
  padding:20px;
  color:var(--text);
  background:#F5F4F1;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;
  line-height:1.6;
}

button{
  font-family:inherit;
}

.container{
  width:100%;
  max-width:1250px;
  margin:0 auto;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:20px;
}

.page-header h1{
  font-size:1.65rem;
}

.page-subtitle{
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
}

.refresh-btn{
  padding:10px 20px;
  border:0;
  border-radius:8px;
  color:#FFFFFF;
  background:var(--primary);
  cursor:pointer;
  font-size:14px;
  transition:background .2s ease;
}

.refresh-btn:hover{
  background:var(--primary-dark);
}

.refresh-btn:disabled{
  cursor:not-allowed;
  opacity:.6;
}

.stats-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(190px,1fr));
  gap:16px;
  margin-bottom:24px;
}

.stat-card{
  padding:20px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--white);
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.stat-card h3{
  margin-bottom:7px;
  color:var(--muted);
  font-size:14px;
  font-weight:500;
}

.stat-card .value{
  color:var(--primary);
  font-size:30px;
  font-weight:bold;
  line-height:1.3;
  word-break:break-word;
}

.stat-card .sub{
  margin-top:4px;
  color:#999999;
  font-size:12px;
}

.section{
  margin-bottom:20px;
  padding:20px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--white);
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.section h2{
  margin-bottom:16px;
  padding-bottom:8px;
  border-bottom:2px solid var(--primary);
  font-size:18px;
}

.section-note{
  margin:-7px 0 14px;
  color:var(--muted);
  font-size:12px;
}

.mode-stats,
.difficulty-stats{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(190px,1fr));
  gap:14px;
}

.mode-card,
.difficulty-card{
  padding:15px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#FAFAF8;
}

.mode-card h4,
.difficulty-card h4{
  margin-bottom:9px;
  color:var(--primary);
  font-size:15px;
}

.difficulty-card.beginner h4{
  color:var(--green);
}

.difficulty-card.intermediate h4{
  color:var(--blue);
}

.difficulty-card.challenge h4{
  color:var(--primary);
}

.difficulty-card.unknown h4{
  color:var(--muted);
}

.mode-card .stat,
.difficulty-card .stat{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:5px 0;
  font-size:13px;
}

.mode-card .stat span:first-child,
.difficulty-card .stat span:first-child{
  color:var(--muted);
}

.mode-card .stat span:last-child,
.difficulty-card .stat span:last-child{
  font-weight:bold;
}

.compatibility-note{
  padding:14px;
  border:1px dashed var(--border);
  border-radius:8px;
  color:var(--muted);
  background:#FAFAF8;
  font-size:13px;
  text-align:center;
}

.table-wrapper{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  min-width:850px;
  border-collapse:collapse;
  font-size:13px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #EEEEEE;
  text-align:left;
  white-space:nowrap;
}

th{
  color:#666666;
  background:#F8F8F6;
  font-weight:600;
}

tbody tr:hover{
  background:#FAFAF8;
}

.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:5px;
  font-size:11px;
  font-weight:500;
}

.badge-identify{
  color:#1976D2;
  background:#E3F2FD;
}

.badge-formula{
  color:#7B1FA2;
  background:#F3E5F5;
}

.badge-classify{
  color:#388E3C;
  background:#E8F5E9;
}

.badge-prescribe{
  color:#F57C00;
  background:#FFF3E0;
}

.badge-match{
  color:#C2185B;
  background:#FCE4EC;
}

.badge-unknown{
  color:#555555;
  background:#EEEEEE;
}

.badge-beginner{
  color:#2E6D32;
  background:#E4F2E2;
}

.badge-intermediate{
  color:#356784;
  background:#E2EEF5;
}

.badge-challenge{
  color:#A13D2C;
  background:#F5E3DF;
}

.badge-unrecorded{
  color:#666666;
  background:#EEEEEE;
}

.loading{
  padding:50px 20px;
  color:#999999;
  text-align:center;
}

.error{
  padding:30px 20px;
  color:var(--danger);
  text-align:center;
}

.error button{
  margin-top:14px;
  padding:8px 16px;
  border:0;
  border-radius:6px;
  color:#FFFFFF;
  background:var(--primary);
  cursor:pointer;
}

.empty{
  padding:25px;
  color:#999999;
  text-align:center;
}

.privacy-notice{
  margin-top:12px;
  padding:11px 14px;
  border-left:3px solid var(--green);
  color:#666666;
  background:#F0F6EF;
  font-size:12px;
}

.update-time{
  margin-bottom:14px;
  color:#999999;
  font-size:12px;
}

.footer{
  padding:10px 0 20px;
  color:#999999;
  font-size:12px;
  text-align:center;
}

@media(max-width:600px){
  body{
    padding:10px;
  }

  .page-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .page-header h1{
    font-size:1.35rem;
  }

  .refresh-btn{
    width:100%;
  }

  .section{
    padding:15px;
  }

  .stats-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .stat-card{
    padding:15px;
  }

  .stat-card .value{
    font-size:24px;
  }
}

@media(max-width:380px){
  .stats-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>
<div class="container">

  <header class="page-header">
    <div>
      <h1>本草堂 - 游戏数据统计</h1>

      <p class="page-subtitle">
        查看游戏平台整体运行情况、各模式参与数据及难度分布
      </p>
    </div>

    <button
      type="button"
      class="refresh-btn"
      id="refresh-button"
    >
      刷新数据
    </button>
  </header>

  <main id="content">
    <div class="loading">
      正在加载统计数据……
    </div>
  </main>

  <footer class="footer">
    本页面仅用于“本草堂”游戏平台运行数据统计与功能优化。
  </footer>

</div>

<script>
"use strict";

/*
 * 统计接口地址。
 * 如果以后更换后台接口，只需要修改此处。
 */
const API_URL =
  "https://br-peppy-grue-dfccd1b7.supabase2.aidap-global.cn-beijing.volces.com/functions/v1/game-stats-api";

/*
 * 五种游戏模式名称。
 */
const MODE_NAMES = {
  identify: "辨药识材",
  formula: "组方配伍",
  classify: "四性五味",
  prescribe: "对症开方",
  match: "药材连连看"
};

const MODE_KEYS = [
  "identify",
  "formula",
  "classify",
  "prescribe",
  "match"
];

/*
 * 难度名称。
 */
const DIFFICULTY_NAMES = {
  beginner: "初学",
  intermediate: "进阶",
  challenge: "挑战",
  unrecorded: "未记录"
};

const DIFFICULTY_ICONS = {
  beginner: "🌱",
  intermediate: "📘",
  challenge: "🔥",
  unrecorded: "—"
};

const DIFFICULTY_KEYS = [
  "beginner",
  "intermediate",
  "challenge",
  "unrecorded"
];

function getElement(id) {
  return document.getElementById(id);
}

/*
 * 转义接口返回文本。
 */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function toNumber(value) {
  const number = Number(value);
  return Number.isFinite(number) ? number : 0;
}

function formatNumber(value) {
  return Math.round(
    toNumber(value)
  ).toLocaleString("zh-CN");
}

function formatAverage(value) {
  const number = toNumber(value);
  const rounded = Math.round(number * 10) / 10;

  return Number.isInteger(rounded)
    ? String(rounded)
    : rounded.toFixed(1);
}

function formatDate(value) {
  if (!value) {
    return "未知";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "未知";
  }

  return date.toLocaleString("zh-CN", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  });
}

/*
 * IP地址脱敏。
 */
function maskIp(ipAddress) {
  if (!ipAddress) {
    return "匿名用户";
  }

  const ip = String(ipAddress).trim();

  if (!ip) {
    return "匿名用户";
  }

  if (ip.includes(".")) {
    const parts = ip.split(".");

    if (parts.length === 4) {
      return [
        parts[0],
        parts[1],
        "*",
        "*"
      ].join(".");
    }
  }

  if (ip.includes(":")) {
    const parts = ip
      .split(":")
      .filter(Boolean);

    if (parts.length >= 2) {
      return (
        parts.slice(0, 2).join(":") +
        ":****:****"
      );
    }

    return ip.slice(0, 4) + "****";
  }

  if (ip.length <= 2) {
    return "**";
  }

  return ip.slice(0, 2) + "****";
}

function getModeName(mode) {
  return MODE_NAMES[mode] || "未知模式";
}

function getModeBadgeClass(mode) {
  return MODE_NAMES[mode]
    ? "badge-" + mode
    : "badge-unknown";
}

/*
 * 兼容多种可能的难度字段值。
 */
function normalizeDifficulty(value) {
  const difficulty = String(value || "")
    .trim()
    .toLowerCase();

  if (
    difficulty === "beginner" ||
    difficulty === "1" ||
    difficulty === "初学" ||
    difficulty === "初学模式"
  ) {
    return "beginner";
  }

  if (
    difficulty === "intermediate" ||
    difficulty === "2" ||
    difficulty === "进阶" ||
    difficulty === "进阶模式"
  ) {
    return "intermediate";
  }

  if (
    difficulty === "challenge" ||
    difficulty === "3" ||
    difficulty === "挑战" ||
    difficulty === "挑战模式"
  ) {
    return "challenge";
  }

  return "unrecorded";
}

function getDifficultyName(value) {
  const difficulty = normalizeDifficulty(value);

  return (
    DIFFICULTY_NAMES[difficulty] ||
    DIFFICULTY_NAMES.unrecorded
  );
}

function getDifficultyIcon(value) {
  const difficulty = normalizeDifficulty(value);

  return (
    DIFFICULTY_ICONS[difficulty] ||
    DIFFICULTY_ICONS.unrecorded
  );
}

function getDifficultyBadgeClass(value) {
  return "badge-" + normalizeDifficulty(value);
}

function createEmptyStats() {
  return {
    count: 0,
    total_score: 0,
    avg_score: 0,
    max_score: 0
  };
}

function normalizeSummaryItem(item) {
  const source = item || {};

  return {
    count: toNumber(source.count),
    total_score: toNumber(source.total_score),
    avg_score: toNumber(source.avg_score),
    max_score: toNumber(source.max_score)
  };
}

/*
 * 对接口数据进行整理。
 */
function normalizeStats(rawStats) {
  const source = rawStats || {};
  const byModeSource = source.by_mode || {};
  const byDifficultySource =
    source.by_difficulty || {};

  const byMode = {};
  const byDifficulty = {};

  MODE_KEYS.forEach(function(mode) {
    byMode[mode] = normalizeSummaryItem(
      byModeSource[mode] || createEmptyStats()
    );
  });

  DIFFICULTY_KEYS.forEach(function(difficulty) {
    byDifficulty[difficulty] =
      normalizeSummaryItem(
        byDifficultySource[difficulty] ||
        createEmptyStats()
      );
  });

  return {
    total_records: toNumber(source.total_records),
    unique_ips: toNumber(source.unique_ips),
    total_score: toNumber(source.total_score),
    by_mode: byMode,
    by_difficulty: byDifficulty,
    has_difficulty_summary:
      Boolean(
        source.by_difficulty &&
        typeof source.by_difficulty === "object" &&
        Object.keys(source.by_difficulty).length
      ),
    recent: Array.isArray(source.recent)
      ? source.recent
      : []
  };
}

/*
 * 若接口尚未返回by_difficulty，
 * 尝试使用recent记录生成一个“最近记录难度分布”。
 */
function calculateRecentDifficultyStats(records) {
  const result = {};

  DIFFICULTY_KEYS.forEach(function(key) {
    result[key] = createEmptyStats();
  });

  records.forEach(function(record) {
    const key = normalizeDifficulty(
      record.difficulty ||
      record.difficulty_name
    );

    const score = toNumber(record.score);

    result[key].count += 1;
    result[key].total_score += score;
    result[key].max_score = Math.max(
      result[key].max_score,
      score
    );
  });

  DIFFICULTY_KEYS.forEach(function(key) {
    const item = result[key];

    item.avg_score =
      item.count > 0
        ? item.total_score / item.count
        : 0;
  });

  return result;
}

async function loadStats() {
  const content = getElement("content");
  const refreshButton =
    getElement("refresh-button");

  refreshButton.disabled = true;
  refreshButton.textContent = "正在刷新……";

  content.innerHTML =
    '<div class="loading">' +
    "正在加载统计数据……" +
    "</div>";

  try {
    const response = await fetch(API_URL, {
      method: "GET",
      headers: {
        "Accept": "application/json"
      },
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "接口请求失败，状态码：" +
        response.status
      );
    }

    const result = await response.json();

    if (!result || result.success !== true) {
      throw new Error(
        result && result.error
          ? result.error
          : "接口未返回有效数据"
      );
    }

    const stats = normalizeStats(result.stats);

    renderStats(stats);
  } catch (error) {
    console.error(
      "加载统计数据失败：",
      error
    );

    content.innerHTML = `
      <div class="section">
        <div class="error">
          <p>统计数据加载失败</p>

          <p style="margin-top:6px;font-size:13px">
            ${escapeHtml(
              error.message || "未知错误"
            )}
          </p>

          <button
            type="button"
            id="retry-button"
          >
            重新加载
          </button>
        </div>
      </div>
    `;

    const retryButton =
      getElement("retry-button");

    if (retryButton) {
      retryButton.addEventListener(
        "click",
        loadStats
      );
    }
  } finally {
    refreshButton.disabled = false;
    refreshButton.textContent = "刷新数据";
  }
}

function renderDifficultyCards(
  difficultyStats,
  summaryType
) {
  let html = `
    <div class="difficulty-stats">
  `;

  DIFFICULTY_KEYS.forEach(function(key) {
    const item =
      difficultyStats[key] ||
      createEmptyStats();

    /*
     * 没有旧版记录时，不单独显示“未记录”卡片。
     */
    if (
      key === "unrecorded" &&
      item.count === 0
    ) {
      return;
    }

    html += `
      <div class="difficulty-card ${escapeHtml(key)}">
        <h4>
          ${escapeHtml(
            getDifficultyIcon(key)
          )}
          ${escapeHtml(
            getDifficultyName(key)
          )}
          ${
            summaryType === "recent"
              ? "（最近记录）"
              : ""
          }
        </h4>

        <div class="stat">
          <span>游戏次数</span>
          <span>
            ${formatNumber(item.count)}
          </span>
        </div>

        <div class="stat">
          <span>累计得分</span>
          <span>
            ${formatNumber(item.total_score)}
          </span>
        </div>

        <div class="stat">
          <span>平均得分</span>
          <span>
            ${formatAverage(item.avg_score)}
          </span>
        </div>

        <div class="stat">
          <span>最高得分</span>
          <span>
            ${formatNumber(item.max_score)}
          </span>
        </div>
      </div>
    `;
  });

  html += "</div>";

  return html;
}

function renderStats(stats) {
  const totalRecords = stats.total_records;
  const totalScore = stats.total_score;

  const averageScore =
    totalRecords > 0
      ? totalScore / totalRecords
      : 0;

  let html = "";

  html += `
    <div class="update-time">
      数据更新时间：
      ${escapeHtml(
        new Date().toLocaleString("zh-CN")
      )}
    </div>
  `;

  /*
   * 总体统计。
   */
  html += `
    <section class="stats-grid">
      <div class="stat-card">
        <h3>总游戏次数</h3>

        <div class="value">
          ${formatNumber(totalRecords)}
        </div>

        <div class="sub">
          所有模式累计完成局数
        </div>
      </div>

      <div class="stat-card">
        <h3>独立访问来源</h3>

        <div class="value">
          ${formatNumber(stats.unique_ips)}
        </div>

        <div class="sub">
          按后台记录的匿名访问来源统计
        </div>
      </div>

      <div class="stat-card">
        <h3>累计游戏得分</h3>

        <div class="value">
          ${formatNumber(totalScore)}
        </div>

        <div class="sub">
          所有游戏记录得分之和
        </div>
      </div>

      <div class="stat-card">
        <h3>平均每局得分</h3>

        <div class="value">
          ${formatAverage(averageScore)}
        </div>

        <div class="sub">
          累计得分 ÷ 总游戏次数
        </div>
      </div>
    </section>
  `;

  /*
   * 游戏模式统计。
   */
  html += `
    <section class="section">
      <h2>各游戏模式统计</h2>

      <div class="mode-stats">
  `;

  MODE_KEYS.forEach(function(mode) {
    const item =
      stats.by_mode[mode] ||
      createEmptyStats();

    html += `
      <div class="mode-card">
        <h4>
          ${escapeHtml(getModeName(mode))}
        </h4>

        <div class="stat">
          <span>游戏次数</span>
          <span>
            ${formatNumber(item.count)}
          </span>
        </div>

        <div class="stat">
          <span>累计得分</span>
          <span>
            ${formatNumber(item.total_score)}
          </span>
        </div>

        <div class="stat">
          <span>平均得分</span>
          <span>
            ${formatAverage(item.avg_score)}
          </span>
        </div>

        <div class="stat">
          <span>最高得分</span>
          <span>
            ${formatNumber(item.max_score)}
          </span>
        </div>
      </div>
    `;
  });

  html += `
      </div>
    </section>
  `;

  /*
   * 难度统计。
   */
  html += `
    <section class="section">
      <h2>游戏难度统计</h2>
  `;

  if (stats.has_difficulty_summary) {
    html += `
      <p class="section-note">
        以下数据由统计接口按难度汇总。
      </p>
    `;

    html += renderDifficultyCards(
      stats.by_difficulty,
      "full"
    );
  } else {
    const recentDifficulty =
      calculateRecentDifficultyStats(
        stats.recent
      );

    const recordedCount =
      recentDifficulty.beginner.count +
      recentDifficulty.intermediate.count +
      recentDifficulty.challenge.count;

    if (recordedCount > 0) {
      html += `
        <p class="section-note">
          当前统计接口尚未返回完整难度汇总，
          以下数据仅根据最近游戏记录计算。
        </p>
      `;

      html += renderDifficultyCards(
        recentDifficulty,
        "recent"
      );
    } else {
      html += `
        <div class="compatibility-note">
          当前后台接口尚未返回游戏难度数据。
          旧版记录及未保存难度的记录会显示为“未记录”。
          这不会影响现有游戏次数、得分和模式统计。
        </div>
      `;
    }
  }

  html += "</section>";

  /*
   * 最近游戏记录。
   */
  html += `
    <section class="section">
      <h2>最近游戏记录</h2>
  `;

  if (stats.recent.length === 0) {
    html += `
      <div class="empty">
        暂无游戏记录
      </div>
    `;
  } else {
    html += `
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>完成时间</th>
              <th>访问来源</th>
              <th>游戏模式</th>
              <th>难度</th>
              <th>本局得分</th>
              <th>已解锁药材</th>
              <th>最高连击</th>
            </tr>
          </thead>

          <tbody>
    `;

    stats.recent
      .slice(0, 50)
      .forEach(function(record) {
        const mode = String(
          record.game_mode || ""
        );

        const modeName =
          getModeName(mode);

        const modeBadgeClass =
          getModeBadgeClass(mode);

        const rawDifficulty =
          record.difficulty ||
          record.difficulty_name ||
          "";

        const difficultyName =
          getDifficultyName(rawDifficulty);

        const difficultyIcon =
          getDifficultyIcon(rawDifficulty);

        const difficultyBadgeClass =
          getDifficultyBadgeClass(
            rawDifficulty
          );

        html += `
          <tr>
            <td>
              ${escapeHtml(
                formatDate(record.created_at)
              )}
            </td>

            <td title="访问来源已脱敏">
              ${escapeHtml(
                maskIp(record.ip_address)
              )}
            </td>

            <td>
              <span
                class="badge ${escapeHtml(
                  modeBadgeClass
                )}"
              >
                ${escapeHtml(modeName)}
              </span>
            </td>

            <td>
              <span
                class="badge ${escapeHtml(
                  difficultyBadgeClass
                )}"
              >
                ${escapeHtml(difficultyIcon)}
                ${escapeHtml(difficultyName)}
              </span>
            </td>

            <td>
              ${formatNumber(record.score)}
            </td>

            <td>
              ${formatNumber(
                record.unlocked_count
              )}
            </td>

            <td>
              ${formatNumber(
                record.combo_max
              )}
            </td>
          </tr>
        `;
      });

    html += `
          </tbody>
        </table>
      </div>
    `;
  }

  html += `
      <div class="privacy-notice">
        为保护使用者隐私，本页面不展示完整IP地址，
        访问来源仅以脱敏形式显示。统计数据主要用于了解游戏平台
        的运行情况和优化游戏功能，不用于识别或评价个人。
      </div>
    </section>
  `;

  getElement("content").innerHTML = html;
}

getElement("refresh-button").addEventListener(
  "click",
  loadStats
);

loadStats();
</script>
