<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>
<meta
  name="description"
  content="本草堂游戏数据统计后台"
>
<title>本草堂 - 游戏数据统计</title>

<style>
*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --primary:#B94A35;
  --primary-dark:#913825;
  --green:#527A52;
  --paper:#F6F1E8;
  --white:#FFFFFF;
  --text:#333333;
  --muted:#777777;
  --border:#E5E0D8;
  --danger:#B63E32;
}

body{
  min-height:100vh;
  padding:20px;
  color:var(--text);
  background:#F5F4F1;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;
  line-height:1.6;
}

button{
  font-family:inherit;
}

.container{
  width:100%;
  max-width:1200px;
  margin:0 auto;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:20px;
}

.page-header h1{
  font-size:1.65rem;
}

.page-subtitle{
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
}

.refresh-btn{
  padding:10px 20px;
  border:0;
  border-radius:8px;
  color:#FFFFFF;
  background:var(--primary);
  cursor:pointer;
  font-size:14px;
  transition:background .2s ease;
}

.refresh-btn:hover{
  background:var(--primary-dark);
}

.refresh-btn:disabled{
  cursor:not-allowed;
  opacity:.6;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:16px;
  margin-bottom:24px;
}

.stat-card{
  padding:20px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--white);
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.stat-card h3{
  margin-bottom:7px;
  color:var(--muted);
  font-size:14px;
  font-weight:500;
}

.stat-card .value{
  color:var(--primary);
  font-size:30px;
  font-weight:bold;
  line-height:1.3;
  word-break:break-word;
}

.stat-card .sub{
  margin-top:4px;
  color:#999999;
  font-size:12px;
}

.section{
  margin-bottom:20px;
  padding:20px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--white);
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.section h2{
  margin-bottom:16px;
  padding-bottom:8px;
  border-bottom:2px solid var(--primary);
  font-size:18px;
}

.mode-stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px;
}

.mode-card{
  padding:15px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#FAFAF8;
}

.mode-card h4{
  margin-bottom:9px;
  color:var(--primary);
  font-size:15px;
}

.mode-card .stat{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:5px 0;
  font-size:13px;
}

.mode-card .stat span:first-child{
  color:var(--muted);
}

.mode-card .stat span:last-child{
  font-weight:bold;
}

.table-wrapper{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  min-width:720px;
  border-collapse:collapse;
  font-size:13px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #EEEEEE;
  text-align:left;
  white-space:nowrap;
}

th{
  color:#666666;
  background:#F8F8F6;
  font-weight:600;
}

tbody tr:hover{
  background:#FAFAF8;
}

.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:5px;
  font-size:11px;
  font-weight:500;
}

.badge-identify{
  color:#1976D2;
  background:#E3F2FD;
}

.badge-formula{
  color:#7B1FA2;
  background:#F3E5F5;
}

.badge-classify{
  color:#388E3C;
  background:#E8F5E9;
}

.badge-prescribe{
  color:#F57C00;
  background:#FFF3E0;
}

.badge-match{
  color:#C2185B;
  background:#FCE4EC;
}

.badge-unknown{
  color:#555555;
  background:#EEEEEE;
}

.loading{
  padding:50px 20px;
  color:#999999;
  text-align:center;
}

.error{
  padding:30px 20px;
  color:var(--danger);
  text-align:center;
}

.error button{
  margin-top:14px;
  padding:8px 16px;
  border:0;
  border-radius:6px;
  color:#FFFFFF;
  background:var(--primary);
  cursor:pointer;
}

.empty{
  padding:25px;
  color:#999999;
  text-align:center;
}

.privacy-notice{
  margin-top:12px;
  padding:11px 14px;
  border-left:3px solid var(--green);
  color:#666666;
  background:#F0F6EF;
  font-size:12px;
}

.update-time{
  margin-bottom:14px;
  color:#999999;
  font-size:12px;
}

.footer{
  padding:10px 0 20px;
  color:#999999;
  font-size:12px;
  text-align:center;
}

@media(max-width:600px){
  body{
    padding:10px;
  }

  .page-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .page-header h1{
    font-size:1.35rem;
  }

  .refresh-btn{
    width:100%;
  }

  .section{
    padding:15px;
  }

  .stats-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .stat-card{
    padding:15px;
  }

  .stat-card .value{
    font-size:24px;
  }
}

@media(max-width:380px){
  .stats-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>
<div class="container">

  <header class="page-header">
    <div>
      <h1>本草堂 - 游戏数据统计</h1>
      <p class="page-subtitle">
        查看游戏平台整体运行情况及各模式参与数据
      </p>
    </div>

    <button
      type="button"
      class="refresh-btn"
      id="refresh-button"
    >
      刷新数据
    </button>
  </header>

  <main id="content">
    <div class="loading">正在加载统计数据……</div>
  </main>

  <footer class="footer">
    本页面仅用于“本草堂”游戏平台运行数据统计与功能优化。
  </footer>

</div>

<script>
"use strict";

/*
 * 统计接口地址
 * 如果以后更换后台接口，只需要修改此处。
 */
const API_URL =
  "https://br-peppy-grue-dfccd1b7.supabase2.aidap-global.cn-beijing.volces.com/functions/v1/game-stats-api";

/*
 * 五种游戏模式的名称
 */
const MODE_NAMES = {
  identify: "辨药识材",
  formula: "组方配伍",
  classify: "四性五味",
  prescribe: "对症开方",
  match: "药材连连看"
};

const MODE_KEYS = [
  "identify",
  "formula",
  "classify",
  "prescribe",
  "match"
];

/*
 * 获取页面元素
 */
function getElement(id) {
  return document.getElementById(id);
}

/*
 * 转义接口返回的文本，防止特殊字符影响页面。
 */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/*
 * 将数值转换为安全数字。
 */
function toNumber(value) {
  const number = Number(value);
  return Number.isFinite(number) ? number : 0;
}

/*
 * 格式化整数。
 */
function formatNumber(value) {
  return Math.round(toNumber(value)).toLocaleString("zh-CN");
}

/*
 * 格式化平均分。
 * 保留一位小数，但整数不显示小数点。
 */
function formatAverage(value) {
  const number = toNumber(value);
  const rounded = Math.round(number * 10) / 10;

  return Number.isInteger(rounded)
    ? String(rounded)
    : rounded.toFixed(1);
}

/*
 * 格式化日期。
 */
function formatDate(value) {
  if (!value) {
    return "未知";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "未知";
  }

  return date.toLocaleString("zh-CN", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  });
}

/*
 * IP地址脱敏。
 *
 * IPv4示例：
 * 192.168.1.25 → 192.168.*.*
 *
 * IPv6示例：
 * 2408:xxxx:xxxx:xxxx → 2408:xxxx:****:****
 */
function maskIp(ipAddress) {
  if (!ipAddress) {
    return "匿名用户";
  }

  const ip = String(ipAddress).trim();

  if (!ip) {
    return "匿名用户";
  }

  /*
   * IPv4
   */
  if (ip.includes(".")) {
    const parts = ip.split(".");

    if (parts.length === 4) {
      return [
        parts[0],
        parts[1],
        "*",
        "*"
      ].join(".");
    }
  }

  /*
   * IPv6
   */
  if (ip.includes(":")) {
    const parts = ip.split(":").filter(Boolean);

    if (parts.length >= 2) {
      return parts.slice(0, 2).join(":") + ":****:****";
    }

    return ip.slice(0, 4) + "****";
  }

  /*
   * 无法判断格式时，仅保留前两位。
   */
  if (ip.length <= 2) {
    return "**";
  }

  return ip.slice(0, 2) + "****";
}

/*
 * 获取模式中文名称。
 */
function getModeName(mode) {
  return MODE_NAMES[mode] || "未知模式";
}

/*
 * 获取模式标签样式。
 */
function getModeBadgeClass(mode) {
  return MODE_NAMES[mode]
    ? "badge-" + mode
    : "badge-unknown";
}

/*
 * 返回一个空的模式统计对象。
 */
function createEmptyModeStats() {
  return {
    count: 0,
    total_score: 0,
    avg_score: 0,
    max_score: 0
  };
}

/*
 * 对接口数据进行整理。
 * 避免接口缺少某个字段时页面报错。
 */
function normalizeStats(rawStats) {
  const source = rawStats || {};
  const byModeSource = source.by_mode || {};
  const byMode = {};

  MODE_KEYS.forEach(function(mode) {
    const item = byModeSource[mode] || createEmptyModeStats();

    byMode[mode] = {
      count: toNumber(item.count),
      total_score: toNumber(item.total_score),
      avg_score: toNumber(item.avg_score),
      max_score: toNumber(item.max_score)
    };
  });

  return {
    total_records: toNumber(source.total_records),
    unique_ips: toNumber(source.unique_ips),
    total_score: toNumber(source.total_score),
    by_mode: byMode,
    recent: Array.isArray(source.recent)
      ? source.recent
      : []
  };
}

/*
 * 加载统计数据。
 */
async function loadStats() {
  const content = getElement("content");
  const refreshButton = getElement("refresh-button");

  refreshButton.disabled = true;
  refreshButton.textContent = "正在刷新……";

  content.innerHTML =
    '<div class="loading">正在加载统计数据……</div>';

  try {
    const response = await fetch(API_URL, {
      method: "GET",
      headers: {
        "Accept": "application/json"
      },
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "接口请求失败，状态码：" + response.status
      );
    }

    const result = await response.json();

    if (!result || result.success !== true) {
      throw new Error(
        result && result.error
          ? result.error
          : "接口未返回有效数据"
      );
    }

    const stats = normalizeStats(result.stats);

    renderStats(stats);
  } catch (error) {
    console.error("加载统计数据失败：", error);

    content.innerHTML = `
      <div class="section">
        <div class="error">
          <p>统计数据加载失败</p>
          <p style="margin-top:6px;font-size:13px">
            ${escapeHtml(error.message || "未知错误")}
          </p>
          <button type="button" id="retry-button">
            重新加载
          </button>
        </div>
      </div>
    `;

    const retryButton = getElement("retry-button");

    if (retryButton) {
      retryButton.addEventListener("click", loadStats);
    }
  } finally {
    refreshButton.disabled = false;
    refreshButton.textContent = "刷新数据";
  }
}

/*
 * 渲染统计页面。
 */
function renderStats(stats) {
  const totalRecords = stats.total_records;
  const totalScore = stats.total_score;

  const averageScore =
    totalRecords > 0
      ? totalScore / totalRecords
      : 0;

  let html = "";

  /*
   * 数据更新时间
   */
  html += `
    <div class="update-time">
      数据更新时间：${escapeHtml(
        new Date().toLocaleString("zh-CN")
      )}
    </div>
  `;

  /*
   * 总体统计
   */
  html += `
    <section class="stats-grid">
      <div class="stat-card">
        <h3>总游戏次数</h3>
        <div class="value">
          ${formatNumber(totalRecords)}
        </div>
        <div class="sub">
          所有模式累计完成局数
        </div>
      </div>

      <div class="stat-card">
        <h3>独立访问来源</h3>
        <div class="value">
          ${formatNumber(stats.unique_ips)}
        </div>
        <div class="sub">
          按后台记录的匿名访问来源统计
        </div>
      </div>

      <div class="stat-card">
        <h3>累计游戏得分</h3>
        <div class="value">
          ${formatNumber(totalScore)}
        </div>
        <div class="sub">
          所有游戏记录得分之和
        </div>
      </div>

      <div class="stat-card">
        <h3>平均每局得分</h3>
        <div class="value">
          ${formatAverage(averageScore)}
        </div>
        <div class="sub">
          累计得分 ÷ 总游戏次数
        </div>
      </div>
    </section>
  `;

  /*
   * 各模式统计
   */
  html += `
    <section class="section">
      <h2>各游戏模式统计</h2>
      <div class="mode-stats">
  `;

  MODE_KEYS.forEach(function(mode) {
    const item =
      stats.by_mode[mode] || createEmptyModeStats();

    html += `
      <div class="mode-card">
        <h4>${escapeHtml(getModeName(mode))}</h4>

        <div class="stat">
          <span>游戏次数</span>
          <span>${formatNumber(item.count)}</span>
        </div>

        <div class="stat">
          <span>累计得分</span>
          <span>${formatNumber(item.total_score)}</span>
        </div>

        <div class="stat">
          <span>平均得分</span>
          <span>${formatAverage(item.avg_score)}</span>
        </div>

        <div class="stat">
          <span>最高得分</span>
          <span>${formatNumber(item.max_score)}</span>
        </div>
      </div>
    `;
  });

  html += `
      </div>
    </section>
  `;

  /*
   * 最近游戏记录
   */
  html += `
    <section class="section">
      <h2>最近游戏记录</h2>
  `;

  if (stats.recent.length === 0) {
    html += `
      <div class="empty">
        暂无游戏记录
      </div>
    `;
  } else {
    html += `
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>完成时间</th>
              <th>访问来源</th>
              <th>游戏模式</th>
              <th>本局得分</th>
              <th>已解锁药材</th>
              <th>最高连击</th>
            </tr>
          </thead>

          <tbody>
    `;

    stats.recent.slice(0, 50).forEach(function(record) {
      const mode = String(record.game_mode || "");
      const modeName = getModeName(mode);
      const badgeClass = getModeBadgeClass(mode);

      html += `
        <tr>
          <td>
            ${escapeHtml(formatDate(record.created_at))}
          </td>

          <td title="访问来源已脱敏">
            ${escapeHtml(maskIp(record.ip_address))}
          </td>

          <td>
            <span class="badge ${escapeHtml(badgeClass)}">
              ${escapeHtml(modeName)}
            </span>
          </td>

          <td>
            ${formatNumber(record.score)}
          </td>

          <td>
            ${formatNumber(record.unlocked_count)}
          </td>

          <td>
            ${formatNumber(record.combo_max)}
          </td>
        </tr>
      `;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;
  }

  html += `
      <div class="privacy-notice">
        为保护使用者隐私，本页面不展示完整 IP 地址，
        访问来源仅以脱敏形式显示。统计数据主要用于了解游戏平台
        的运行情况和优化游戏功能，不用于识别或评价个人。
      </div>
    </section>
  `;

  getElement("content").innerHTML = html;
}

/*
 * 刷新按钮
 */
getElement("refresh-button").addEventListener(
  "click",
  loadStats
);

/*
 * 页面打开后自动加载数据
 */
loadStats();
</script>
</body>
</html>
